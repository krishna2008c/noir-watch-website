<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOIR — Page Not Found</title>
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<meta name="description" content="The requested NOIR page could not be found.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:title" content="NOIR — Page Not Found">
<meta property="og:description" content="The requested NOIR page could not be found.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NOIR">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="NOIR — Page Not Found">
<meta name="twitter:description" content="The requested NOIR page could not be found.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23050505%22/%3E%3Ctext x=%2232%22 y=%2242%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2230%22 font-weight=%22700%22 fill=%22white%22%3EN%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:7vw}
main{max-width:900px}
small{color:#666;font-size:10px;letter-spacing:5px}
h1{font-size:clamp(70px,15vw,190px);line-height:.82;letter-spacing:-8px;margin:28px 0}
h1 span{color:#555}
p{color:#888;max-width:480px;line-height:1.8;font-size:14px}
a{display:inline-block;margin-top:35px;padding:16px 28px;border:1px solid #333;color:#fff;text-decoration:none;font-size:10px;letter-spacing:3px;transition:.3s}
a:hover{background:#fff;color:#050505}



/* ===== FINAL GLOBAL READABILITY SYNC =====
   Same small-text readability treatment across every NOIR page.
   Large muted display typography is intentionally left untouched.
*/

:root {
    --noir-readable-primary: #ffffff;
    --noir-readable-secondary: #eeeeee;
    --noir-readable-muted: #d4d4d4;
    --noir-readable-soft: #c6c6c6;
}

/* ---------- Small uppercase labels / metadata ---------- */
.eyebrow,
.collection-eyebrow,
.section-label,
.product-detail-label,
.detail-eyebrow,
.hero-label,
.parallax-text,
.timepiece-top,
.philosophy-top,
.collection-top,
.collection-top span,
.craft-top,
.craft-top span,
.product-number,
.number,
.scroll,
.noir-footer-eyebrow,
.cart-eyebrow,
.checkout-label,
.field label,
.secure,
.secure-text,
.story-cta > p,
.story-hero > p,
.story-hero .eyebrow,
.philosophy > p,
.philosophy-right > p:first-child,
.statement > p,
.feature h3,
.feature h4 {
    color: var(--noir-readable-secondary) !important;
    font-weight: 600 !important;
    text-shadow: 0 0 1px rgba(255,255,255,.08);
}

/* Give genuinely tiny labels enough physical size on desktop. */
@media (min-width: 901px) {
    .eyebrow,
    .collection-eyebrow,
    .section-label,
    .product-detail-label,
    .detail-eyebrow,
    .hero-label,
    .parallax-text,
    .timepiece-top,
    .timepiece-top span,
    .philosophy-top,
    .philosophy-top span,
    .collection-top,
    .collection-top span,
    .craft-top,
    .craft-top span,
    .product-number,
    .number,
    .scroll,
    .noir-footer-eyebrow,
    .cart-eyebrow,
    .checkout-label,
    .field label,
    .secure,
    .secure-text,
    .feature h3 {
        font-size: 12px !important;
        line-height: 1.5 !important;
    }
}

/* Mobile small text must still be clearly readable. */
@media (max-width: 900px) {
    .eyebrow,
    .collection-eyebrow,
    .section-label,
    .product-detail-label,
    .detail-eyebrow,
    .hero-label,
    .parallax-text,
    .timepiece-top,
    .timepiece-top span,
    .philosophy-top,
    .philosophy-top span,
    .collection-top,
    .collection-top span,
    .craft-top,
    .craft-top span,
    .product-number,
    .number,
    .scroll,
    .noir-footer-eyebrow,
    .cart-eyebrow,
    .checkout-label,
    .field label,
    .secure,
    .secure-text,
    .feature h3 {
        font-size: 11.5px !important;
        line-height: 1.55 !important;
    }
}

/* ---------- Product technical specification labels ---------- */
.spec,
.spec span,
.detail-specs,
.detail-specs span,
.watch-specs span,
.product-info p,
.summary-info p,
.cart-item-info p,
.summary-top,
.summary-top span,
.total-row span:first-child,
.cart-total span:first-child {
    color: var(--noir-readable-muted) !important;
    font-weight: 600 !important;
}

.spec span:first-child,
.detail-specs span,
.watch-specs span,
.product-info p,
.summary-info p,
.cart-item-info p {
    color: var(--noir-readable-muted) !important;
}

.spec span:last-child,
.detail-specs strong,
.watch-specs strong,
.product-info strong,
.summary-price,
.cart-item-price,
.price,
.collection-price,
.total-row.final,
.cart-total strong {
    color: var(--noir-readable-primary) !important;
    font-weight: 650 !important;
}

/* Product pages: labels such as CASE / MOVEMENT / POWER RESERVE */
.specs .spec span:first-child {
    color: #d2d2d2 !important;
    font-weight: 600 !important;
}

@media (min-width: 901px) {
    .spec,
    .spec span,
    .detail-specs span,
    .watch-specs span,
    .product-info p,
    .summary-info p,
    .cart-item-info p {
        font-size: 12px !important;
    }
}

@media (max-width: 900px) {
    .spec,
    .spec span,
    .detail-specs span,
    .watch-specs span,
    .product-info p,
    .summary-info p,
    .cart-item-info p {
        font-size: 12px !important;
    }
}

/* ---------- Supporting copy / paragraphs ---------- */
.description,
.detail-description,
.hero-description,
.collection-hero-content p,
.product-card p,
.story-intro,
.story-hero p,
.philosophy-right p,
.philosophy-text p,
.statement p,
.story-cta p,
.feature p,
.hero-text,
.craft p,
.noir-footer-copy p,
.payment-note,
.checkout p,
.success-inner p {
    color: var(--noir-readable-muted) !important;
    font-weight: 500 !important;
}

@media (min-width: 901px) {
    .description,
    .detail-description,
    .hero-description,
    .collection-hero-content p,
    .story-intro,
    .story-hero p,
    .philosophy-right p,
    .philosophy-text p,
    .statement p,
    .story-cta p,
    .feature p,
    .hero-text,
    .craft p,
    .noir-footer-copy p,
    .payment-note {
        font-size: 15px !important;
        line-height: 1.8 !important;
    }

    /* Card copy stays compact, but no longer faded. */
    .product-card p {
        color: #d0d0d0 !important;
        font-size: 11px !important;
        font-weight: 600 !important;
    }
}

@media (max-width: 900px) {
    .description,
    .detail-description,
    .hero-description,
    .collection-hero-content p,
    .story-intro,
    .story-hero p,
    .philosophy-right p,
    .philosophy-text p,
    .statement p,
    .story-cta p,
    .feature p,
    .hero-text,
    .craft p,
    .noir-footer-copy p,
    .payment-note {
        font-size: 15px !important;
        line-height: 1.8 !important;
    }

    .product-card p {
        color: #d0d0d0 !important;
        font-size: 11px !important;
        font-weight: 600 !important;
    }
}

/* ---------- Navigation / secondary links ---------- */
.nav-links a,
header nav a,
.back-link,
.product-link,
.philosophy-link,
.noir-footer-links a {
    color: #d5d5d5 !important;
    font-weight: 600 !important;
}

.nav-links a:hover,
header nav a:hover,
.back-link:hover,
.product-link:hover,
.philosophy-link:hover,
.noir-footer-links a:hover,
.nav-links a.noir-active,
header nav a.noir-active {
    color: #ffffff !important;
}

/* ---------- Footer ---------- */
.noir-footer-bottom,
.noir-footer-bottom span,
.noir-footer-status {
    color: #d2d2d2 !important;
    font-weight: 600 !important;
}

.noir-footer-copy p {
    color: #d0d0d0 !important;
}

/* ---------- Checkout form ---------- */
.field input,
.field select,
.field textarea {
    color: #ffffff !important;
    font-weight: 500 !important;
}

.field input::placeholder,
.field textarea::placeholder {
    color: #aaaaaa !important;
    opacity: 1 !important;
}

/* Preserve intentional giant gray display words such as
   REDEFINED / REMEMBERED / TIME, REFINED. */

</style>
</head>
<body>
<main>
<small>NOIR / 404</small>
<h1>TIME<br><span>LOST.</span></h1>
<p>The page you were looking for is no longer here, or the address has changed.</p>
<a href="index.html">RETURN HOME →</a>
</main>
</body>
</html>
